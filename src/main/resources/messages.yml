# Messages envoyés aux joueurs par /void, /shvoiditems et par le Marchand des abîmes.

# Menu du Marchand des abîmes
no-island: "&7[NPC] &8Marchand des Abîmes &8&l» &fVous n'avez pas encore d'île..."
purchase-no-funds: "&7[NPC] &8Marchand des Abîmes &8&l» &fVous n'avez pas assez d'éclats d'echo."
purchase-no-space: "&7[NPC] &8Marchand des Abîmes &8&l» &fVotre inventaire est plein."
purchase-success: "&7[NPC] &8Marchand des Abîmes &8&l» &fL'abîme veut bien te rendre ton item, cette fois ci... &7(&aAchat réussi !&7)"
# Compte à rebours d'un item arrivé à expiration
expired: "&cExpiré"
# Valeur de %currency% dans purchase-no-funds quand la monnaie est l'argent (currency.type: money)
currency-money: "argent"

# Commandes /void et /shvoiditems
player-only: "&7&l« &c&lSH &8&l» &7Cette commande est réservée aux &cjoueurs&7."
no-permission: "&8&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose."
player-not-found: "&7&l« &c&lSH &8&l» &7Joueur &cintrouvable&7."
target-no-island: "&7&l« &c&lSH &8&l» &7Ce joueur n'a &cpas d'île&7."
internal-error: "&7&l« &c&lSH &8&l» &7Une &cerreur &7est survenue, consultez la console."

# /shvoiditems sans argument, ou avec une sous-commande inconnue. {subcommands} : celles que l'expéditeur peut utiliser
usage: "&7&l« &e&lSH &8&l» &7Utilisation : &e/shvoiditems &7<&e{subcommands}&7>"

# /shvoiditems reload. {file} : fichier illisible, {error} : cause (l'ancienne configuration reste en place)
reload-done: "&7&l« &a&lSH &8&l» &7Configuration et messages rechargés."
reload-error: "&7&l« &c&lSH &8&l» &7Rechargement annulé, &c{file} &7est illisible : &c{error}"
reload-restart: "&7&l« &6&lSH &8&l» &7La section &6reseau &7ne se lit qu'au démarrage : &6redémarrage nécessaire &7pour la changer."

# Mode réseau : île hébergée par un autre serveur
network-forward: "&7&l« &e&lSH &8&l» &7Ton île est sur le serveur &e{serveur}&7 : le menu s'ouvre &eà ton arrivée&7."
network-other-server: "&7&l« &6&lSH &8&l» &7L'île de ce joueur est sur le serveur &6{serveur}&7 : son menu s'ouvre depuis là-bas."
