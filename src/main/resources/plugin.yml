name: SHVoidItems
version: '${project.version}'
main: org.Cry_Legende.sHVoidItems.SHVoidItems
api-version: '1.20'
author: Cry_Legende
depend: [SuperiorSkyblock2, Vault]
# Facultatifs : SHLogs (journal des rachats), WildStacker (quantité réelle des piles au sol), SHInventoryPages (rachats rangés
# dans toutes les pages du joueur). SHNetwork et SHSkyBridge : sans eux, le plugin se comporte comme sur un serveur seul.
softdepend: [SHLogs, WildStacker, SHInventoryPages, SHNetwork, SHSkyBridge]

commands:
  void:
    description: Ouvre le menu des Void Items pour vous ou pour un autre joueur (admin)
    usage: /<command> [player]
    aliases: [shvoid]
    permission: shvoiditems.use
    permission-message: Vous n'avez pas la permission d'utiliser cette commande.
  shvoiditems:
    description: Administration de SHVoidItems.
    usage: /<command> <view|reload>

permissions:
  shvoiditems.use:
    description: Permet d’ouvrir son propre menu void.
    default: true
  shvoiditems.admin:
    description: Toutes les sous-commandes de /shvoiditems (view, reload).
    default: op
    children:
      shvoiditems.admin.view: true
      shvoiditems.admin.reload: true
  shvoiditems.admin.view:
    description: Permet d’ouvrir le menu void d’un autre joueur (/shvoiditems view, ancien /void <joueur>).
    default: op
  shvoiditems.admin.reload:
    description: Recharger config.yml et messages.yml (/shvoiditems reload).
    default: op
