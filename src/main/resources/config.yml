# SHVoidItems
#
# Garde les items tombés dans le vide d'une île et les propose au rachat dans le menu du Marchand des abîmes.
# Un item qui sort du monde par le bas, à moins de void-margin blocs d'une île, est retenu pour cette île : les items
# identiques se cumulent, et l'ensemble disparaît defaults.expire-seconds après le premier. Avec WildStacker, c'est la
# quantité réelle d'une pile au sol qui est retenue. Avec SHInventoryPages, un rachat se range aussi dans les autres pages
# de l'inventaire du joueur, et non plus seulement dans l'inventaire porté.
# Les messages sont dans messages.yml.
#
# Commandes :
#   /void (alias /shvoid)           Ouvre le menu des items tombés dans le vide de son île.
#   /shvoiditems view <joueur>      Ouvre le menu des items tombés dans le vide de l'île d'un joueur en ligne (complétion
#                                   des joueurs en ligne). /void <joueur> marche toujours.
#   /shvoiditems reload             Relit config.yml et messages.yml (un fichier illisible ne change rien, data.yml n'est
#                                   jamais relu). defaults.expire-seconds ne vaut que pour les items retenus ensuite ;
#                                   la section reseau demande un redémarrage.
#
# Permissions :
#   shvoiditems.use            Ouvrir son propre menu (accordée à tous par défaut).
#   shvoiditems.admin          Toutes les sous-commandes de /shvoiditems (op par défaut).
#   shvoiditems.admin.view     /shvoiditems view : ouvrir le menu d'un autre joueur (op par défaut).
#   shvoiditems.admin.reload   /shvoiditems reload (op par défaut).

menu:
  title: "&8Marchand des abîmes &7(%page%/%max%)"
  # Items par page, de 1 à 54 (les boutons ci-dessous prennent leur propre emplacement : 45 leur laisse la dernière ligne)
  items-per-page: 45
  # Période de mise à jour du menu ouvert (compte à rebours, quantités), en ticks
  refresh-ticks: 20
  # Boutons : material, display-name, slot (0 à 53) et, pour 'close', la commande lancée au clic (sinon le menu se ferme)
  items:
    prev-page:
      material: "ARROW"
      display-name: "&a← Page précédente"
      slot: 45
    next-page:
      material: "ARROW"
      display-name: "&aPage suivante →"
      slot: 53
    close:
      material: "PAPER"
      display-name: "&c⤾ Retour &7(Clic)"
      slot: 49
      command: "dm open island_more"

# Monnaie des rachats. type : "item" (autant d'exemplaires de currency.item que le prix) ou "money" (argent Vault)
currency:
  type: "item"
  item: "ECHO_SHARD"

# expire-seconds : durée de rétention d'un item avant qu'il disparaisse. price : prix d'un rachat, quelle que soit la quantité.
defaults:
  expire-seconds: 86400
  price: 1

# Prix par matériau (nom du matériau), à la place de defaults.price
custom:
  SPAWNER:
    price: 5
  RESPAWN_ANCHOR:
    price: 10
  DRAGON_EGG:
    price: 10
  REINFORCED_DEEPSLATE:
    price: 5
  BARREL:
    price: 5
  CHEST:
    price: 4

  DIAMOND_SWORD:
    price: 4
  DIAMOND_HELMET:
    price: 4
  DIAMOND_CHESTPLATE:
    price: 4
  DIAMOND_LEGGINGS:
    price: 4
  DIAMOND_BOOTS:
    price: 4
  DIAMOND_PICKAXE:
    price: 4
  DIAMOND_SHOVEL:
    price: 4
  DIAMOND_AXE:
    price: 4
  DIAMOND_HOE:
    price: 4

  NETHERITE_SWORD:
    price: 10
  NETHERITE_HELMET:
    price: 10
  NETHERITE_CHESTPLATE:
    price: 10
  NETHERITE_LEGGINGS:
    price: 10
  NETHERITE_BOOTS:
    price: 10
  NETHERITE_PICKAXE:
    price: 10
  NETHERITE_SHOVEL:
    price: 10
  NETHERITE_AXE:
    price: 10
  NETHERITE_HOE:
    price: 10

# Matériaux jamais retenus
blacklist:
  - STONE
  - DIRT

# Compte à rebours de %countdown%
countdown-format: "&e%h%h %m%m %s%s"

# Lore des items du menu. Variables : %lore% (lore d'origine de l'item), %quantity%, %countdown%, %price%.
lore:
  - "%lore%"
  - ""
  - "&7Quantité : &e%quantity%"
  - "&7Disparait dans : &e%countdown%"
  - "&7Récupérer pour : &5%price% éclat d'echo"
  - ""
  - "&7&o(( &5&oCliquez pour récupérer &7&o))"

options:
  # Son joué au rachat (clé du son), vide pour aucun
  buy-sound: "minecraft:ambient.basalt_deltas.mood"

# Marge en blocs autour d'une île où un item tombé dans le vide lui est encore attribué.
void-margin: 3.0

# data.yml : écriture (seulement si quelque chose a changé) et retrait des items expirés, en secondes.
data:
  save-seconds: 60
  expire-check-seconds: 60

# Lignes écrites dans SHLogs (plugins/SHLogs/SHVoidItems/).
# file : nom du fichier de log. format : ligne écrite.
logs:
  # Rachat d'un item par un joueur.
  # Variables : %player%, %amount%, %item%, %price%.
  purchase:
    file: "rachats"
    format: "%player% -> rachète %amount% %item% (%price% éclats d'écho)"

# Mode réseau. Actif seulement si SHSkyBridge et SHNetwork sont installés (plusieurs serveurs se partagent les îles,
# chacune étant hébergée par un seul) et 'actif' vaut true. Un serveur ne garde les items tombés dans le vide que des
# îles qu'il héberge et n'efface rien des autres ; /void envoie le joueur sur le serveur de son île, où le menu s'ouvre
# à l'arrivée. Les items d'une île suivent l'île quand SHSkyBridge la déplace. Sans eux, rien de ceci n'est utilisé.
# Demande un redémarrage.
reseau:
  actif: true
  # Durée, en secondes, pendant laquelle l'ouverture du menu reste valable après l'annonce du joueur au serveur de son île
  arrivee-secondes: 60
